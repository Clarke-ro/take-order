openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Products and inventory
  - name: orders
    description: Seller orders and buyer checkout
  - name: dashboard
    description: Business summaries
  - name: expenses
    description: Operating expense tracking
  - name: settings
    description: Seller workspace settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List catalog products
      responses:
        "200":
          description: Catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Update a catalog product
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [catalog]
      summary: Delete a catalog product
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Product deleted
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List seller orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a take order link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a seller order
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status or fulfillment
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /public/orders/{token}:
    get:
      operationId: getPublicOrder
      tags: [orders]
      summary: Get a buyer-facing order link
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      responses:
        "200":
          description: Buyer-facing order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrder"
    post:
      operationId: submitPublicOrder
      tags: [orders]
      summary: Submit buyer details and payment intent
      parameters:
        - $ref: "#/components/parameters/TokenParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicOrderInput"
      responses:
        "200":
          description: Submitted order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get seller dashboard summary
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive start date for the reporting window.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive end date for the reporting window.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List operating expenses
      responses:
        "200":
          description: Operating expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Record an operating expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created operating expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an operating expense
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated operating expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an operating expense
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Operating expense deleted
  /settings:
    get:
      operationId: getSellerSettings
      tags: [settings]
      summary: Get seller workspace settings
      responses:
        "200":
          description: Seller workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSettings"
    put:
      operationId: updateSellerSettings
      tags: [settings]
      summary: Save seller workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerSettingsInput"
      responses:
        "200":
          description: Saved seller workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSettings"
  /currency-hint:
    get:
      operationId: getCurrencyHint
      tags: [settings]
      summary: Suggest a seller currency from request location
      responses:
        "200":
          description: Currency suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyHint"
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, sku, description, price, compareAtPrice, cost, stock, variants, preferences, customFields, imageUrl, imageUrls, accent]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        sku: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        cost: { type: ["number", "null"] }
        stock: { type: integer }
        variants:
          type: array
          items: { type: string }
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/ProductPreferenceGroup"
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductCustomField"
        imageUrl: { type: ["string", "null"], maxLength: 4000000, pattern: "^(https?:\\/\\/|data:image\\/(png|jpeg|webp|gif);base64,)" }
        imageUrls:
          type: array
          items: { type: string, maxLength: 4000000, pattern: "^(https?:\\/\\/|data:image\\/(png|jpeg|webp|gif);base64,)" }
        accent: { type: string }
    ProductPreferenceGroup:
      type: object
      required: [label, options]
      properties:
        label: { type: string, minLength: 1 }
        options:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    ProductInput:
      type: object
      required: [name, category, price, stock]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        sku: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: ["number", "null"], minimum: 0 }
        cost: { type: ["number", "null"], minimum: 0 }
        stock: { type: integer, minimum: 0 }
        variants:
          type: array
          items: { type: string }
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/ProductPreferenceGroup"
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductCustomField"
        imageUrl: { type: ["string", "null"], maxLength: 4000000, pattern: "^(https?:\\/\\/|data:image\\/(png|jpeg|webp|gif);base64,)" }
        imageUrls:
          type: array
          items: { type: string, maxLength: 4000000, pattern: "^(https?:\\/\\/|data:image\\/(png|jpeg|webp|gif);base64,)" }
        accent: { type: string }
    ProductCustomField:
      type: object
      required: [label, value]
      properties:
        label: { type: string, minLength: 1 }
        value: { type: string }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        sku: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        price: { type: number, minimum: 0 }
        compareAtPrice: { type: ["number", "null"], minimum: 0 }
        cost: { type: ["number", "null"], minimum: 0 }
        stock: { type: integer, minimum: 0 }
        variants:
          type: array
          items: { type: string }
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/ProductPreferenceGroup"
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/ProductCustomField"
        imageUrl: { type: ["string", "null"], maxLength: 4000000, pattern: "^(https?:\\/\\/|data:image\\/(png|jpeg|webp|gif);base64,)" }
        imageUrls:
          type: array
          items: { type: string, maxLength: 4000000, pattern: "^(https?:\\/\\/|data:image\\/(png|jpeg|webp|gif);base64,)" }
        accent: { type: string }
    Order:
      type: object
      required: [id, token, productId, productName, customerName, channel, amount, deliveryFee, deliveryMethod, deliveryAddress, productCost, paymentMode, status, fulfillment, createdAt, linkOpens, shares, likes, engagementSource, items]
      properties:
        id: { type: integer }
        token: { type: string }
        productId: { type: integer }
        productName: { type: string }
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        channel: { type: string }
        amount: { type: number }
        deliveryFee: { type: number }
        deliveryMethod: { type: ["string", "null"], enum: [pickup, delivery, null] }
        deliveryAddress: { type: ["string", "null"] }
        productCost: { type: ["number", "null"] }
        depositAmount: { type: ["number", "null"] }
        paymentMode: { type: string, enum: [full, deposit, reserve] }
        status: { type: string, enum: [reserved, deposit_paid, paid] }
        fulfillment: { type: string, enum: [pending, shipped, delivered] }
        createdAt: { type: string }
        linkOpens: { type: integer }
        shares: { type: ["integer", "null"], description: Recorded shares for this order when provided by a connected social source. }
        likes: { type: ["integer", "null"], description: Recorded likes for this order when provided by a connected social source. }
        engagementSource: { type: ["string", "null"], enum: [connected_account, null], description: Source used for the recorded engagement values. Null means no engagement has been recorded. }
        referenceImage: { type: ["string", "null"] }
        buyerDetails: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
    OrderItemInput:
      type: object
      required: [productId, amount]
      properties:
        productId: { type: integer }
        amount: { type: number, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
    OrderLineItem:
      type: object
      required: [productId, productName, amount, quantity]
      properties:
        productId: { type: integer }
        productName: { type: string }
        amount: { type: number }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [paymentMode, channel]
      properties:
        productId: { type: integer }
        amount: { type: number, minimum: 0 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
        deliveryFee: { type: number, minimum: 0 }
        depositAmount: { type: ["number", "null"], minimum: 0 }
        paymentMode: { type: string, enum: [full, deposit, reserve] }
        channel: { type: string, enum: [whatsapp, instagram, tiktok, snapchat, in_person] }
    OrderUpdate:
      type: object
      properties:
        status: { type: string, enum: [reserved, deposit_paid, paid] }
        fulfillment: { type: string, enum: [pending, shipped, delivered] }
    PublicOrder:
      type: object
      required: [token, productName, amount, subtotal, deliveryFee, paymentMode, status, variants, items, businessName, businessDescription, logoDataUrl, currency, deliveryDefault, checkoutAskForDetails, checkoutAllowReferenceImages]
      properties:
        token: { type: string }
        productName: { type: string }
        amount: { type: number }
        subtotal: { type: number }
        deliveryFee: { type: number }
        deliveryMethod: { type: ["string", "null"], enum: [pickup, delivery, null] }
        depositAmount: { type: ["number", "null"] }
        paymentMode: { type: string, enum: [full, deposit, reserve] }
        status: { type: string, enum: [reserved, deposit_paid, paid] }
        businessName: { type: string }
        businessDescription: { type: string }
        logoDataUrl: { type: ["string", "null"] }
        currency: { type: string, enum: [AED, AFN, ALL, AMD, ANG, AOA, ARS, AUD, AWG, AZN, BAM, BBD, BDT, BGN, BHD, BIF, BMD, BND, BOB, BRL, BSD, BTN, BWP, BYN, BZD, CAD, CDF, CHF, CLP, CNY, COP, CRC, CUP, CVE, CZK, DJF, DKK, DOP, DZD, EGP, ERN, ETB, EUR, FJD, FKP, GBP, GEL, GHS, GIP, GMD, GNF, GTQ, GYD, HKD, HNL, HTG, HUF, IDR, ILS, INR, IQD, IRR, ISK, JMD, JOD, JPY, KES, KGS, KHR, KMF, KPW, KRW, KWD, KYD, KZT, LAK, LBP, LKR, LRD, LSL, LYD, MAD, MDL, MGA, MKD, MMK, MNT, MOP, MRU, MUR, MVR, MWK, MXN, MYR, MZN, NAD, NGN, NIO, NOK, NPR, NZD, OMR, PAB, PEN, PGK, PHP, PKR, PLN, PYG, QAR, RON, RSD, RUB, RWF, SAR, SBD, SCR, SDG, SEK, SGD, SHP, SLE, SOS, SRD, SSP, STN, SYP, SZL, THB, TJS, TMT, TND, TOP, TRY, TTD, TWD, TZS, UAH, UGX, USD, UYU, UZS, VES, VND, VUV, WST, XAF, XCD, XOF, XPF, YER, ZAR, ZMW, ZWL] }
        deliveryDefault: { type: string, enum: [pickup, delivery, both] }
        checkoutAskForDetails: { type: boolean }
        checkoutAllowReferenceImages: { type: boolean }
        variants:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicOrderItem"
    PublicOrderItem:
      type: object
      required: [productId, productName, amount, quantity, variants, preferences, source, sku, description, compareAtPrice, imageUrls, stock, available]
      properties:
        productId: { type: integer }
        productName: { type: string }
        amount: { type: number }
        quantity: { type: integer, minimum: 1 }
        variants:
          type: array
          items: { type: string }
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/ProductPreferenceGroup"
        source: { type: string, enum: [catalog, custom] }
        sku: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        compareAtPrice: { type: ["number", "null"] }
        imageUrls:
          type: array
          items: { type: string, format: uri }
        stock: { type: integer, minimum: 0 }
        available: { type: boolean }
    PublicOrderItemDetails:
      type: object
      required: [itemIndex]
      properties:
        itemIndex: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
        variant: { type: string }
        details: { type: string }
        referenceImage: { type: string }
    PublicOrderInput:
      type: object
      required: [customerName, customerPhone]
      properties:
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 5 }
        buyerDetails: { type: string }
        deliveryMethod: { type: string, enum: [pickup, delivery] }
        deliveryAddress: { type: string }
        referenceImage: { type: string }
        itemDetails:
          type: array
          items:
            $ref: "#/components/schemas/PublicOrderItemDetails"
        paymentAction: { type: string, enum: [pay, reserve] }
    DashboardSummary:
      type: object
      required: [revenue, productCosts, estimatedProductCosts, operatingExpenses, expenses, profit, cashBalance, orders, snapshotOrders, legacyOrders, legacyRevenue, outstanding, bestSeller, shares, likes, channelPerformance, dailyPerformance, productPerformance, insights]
      properties:
        revenue: { type: number }
        productCosts: { type: number }
        estimatedProductCosts: { type: number, description: Current catalog-cost estimates included for legacy sales without a captured sale-time cost. }
        operatingExpenses: { type: number }
        expenses: { type: number }
        profit: { type: number }
        cashBalance: { type: number }
        orders: { type: integer }
        snapshotOrders: { type: integer, description: Paid orders with a captured sale-time product cost. }
        legacyOrders: { type: integer, description: Paid orders without a captured sale-time product cost. Their product costs and margins may use the current catalog cost. }
        legacyRevenue: { type: number, description: Revenue from paid orders without a captured sale-time product cost. }
        outstanding: { type: number }
        bestSeller: { type: string }
        shares: { type: ["integer", "null"], description: Total recorded shares in the reporting window, or null when no share activity has been recorded. }
        likes: { type: ["integer", "null"], description: Total recorded likes in the reporting window, or null when no like activity has been recorded. }
        channelPerformance:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPerformance"
        insights:
          type: array
          items: { type: string }
        dailyPerformance:
          type: array
          items:
            $ref: "#/components/schemas/DailyPerformance"
        productPerformance:
          type: array
          items:
            $ref: "#/components/schemas/ProductPerformance"
    ChannelPerformance:
      type: object
      required: [channel, revenue, orders, paidOrders, opens, conversionRate]
      properties:
        channel: { type: string }
        revenue: { type: number }
        orders: { type: integer }
        paidOrders: { type: integer }
        opens: { type: integer }
        conversionRate: { type: number }
    DailyPerformance:
      type: object
      required: [date, label, revenue, productCosts, operatingExpenses, expenses, profit, orders]
      properties:
        date: { type: string }
        label: { type: string }
        revenue: { type: number }
        productCosts: { type: number }
        operatingExpenses: { type: number }
        expenses: { type: number }
        profit: { type: number }
        orders: { type: integer }
    ProductPerformance:
      type: object
      required: [name, category, revenue, orders, stock, margin, costTracked, marginStatus, snapshotOrders, legacyOrders]
      properties:
        name: { type: string }
        category: { type: string }
        revenue: { type: number }
        orders: { type: integer }
        stock: { type: integer }
        margin: { type: number }
        costTracked: { type: boolean }
        marginStatus: { type: string, enum: [tracked, estimated, unavailable], description: Whether the displayed margin is fully snapshot-backed, includes legacy estimates, or has no usable cost. }
        snapshotOrders: { type: integer, description: Paid orders with a captured sale-time product cost for this product. }
        legacyOrders: { type: integer, description: Paid orders without a captured sale-time product cost for this product. }
    Expense:
      type: object
      required: [id, title, category, amount, date, note, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string, enum: [rent, delivery, advertising, supplies, fees, other] }
        amount: { type: number }
        date: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string }
    ExpenseInput:
      type: object
      required: [title, category, amount, date]
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string, enum: [rent, delivery, advertising, supplies, fees, other] }
        amount: { type: number, minimum: 0 }
        date: { type: string }
        note: { type: string }
    ExpenseUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string, enum: [rent, delivery, advertising, supplies, fees, other] }
        amount: { type: number, minimum: 0 }
        date: { type: string }
        note: { type: ["string", "null"] }
    SellerSettings:
      type: object
      required: [sellerName, businessName, description, logoDataUrl, channels, currency, paymentMode, checkoutAskForDetails, checkoutAllowReferenceImages, deliveryDefault, deliveryFee, customDomain, seoTitle, seoDescription, trackingId, organizationName, organizationEmail, organizationPhone, organizationCountry, organizationAddress, orderUpdates, stockAlerts, compactTables, connectedTools]
      properties:
        sellerName: { type: string }
        businessName: { type: string }
        description: { type: string }
        logoDataUrl: { type: ["string", "null"] }
        channels:
          type: array
          items: { type: string }
        currency: { type: string, enum: [AED, AFN, ALL, AMD, ANG, AOA, ARS, AUD, AWG, AZN, BAM, BBD, BDT, BGN, BHD, BIF, BMD, BND, BOB, BRL, BSD, BTN, BWP, BYN, BZD, CAD, CDF, CHF, CLP, CNY, COP, CRC, CUP, CVE, CZK, DJF, DKK, DOP, DZD, EGP, ERN, ETB, EUR, FJD, FKP, GBP, GEL, GHS, GIP, GMD, GNF, GTQ, GYD, HKD, HNL, HTG, HUF, IDR, ILS, INR, IQD, IRR, ISK, JMD, JOD, JPY, KES, KGS, KHR, KMF, KPW, KRW, KWD, KYD, KZT, LAK, LBP, LKR, LRD, LSL, LYD, MAD, MDL, MGA, MKD, MMK, MNT, MOP, MRU, MUR, MVR, MWK, MXN, MYR, MZN, NAD, NGN, NIO, NOK, NPR, NZD, OMR, PAB, PEN, PGK, PHP, PKR, PLN, PYG, QAR, RON, RSD, RUB, RWF, SAR, SBD, SCR, SDG, SEK, SGD, SHP, SLE, SOS, SRD, SSP, STN, SYP, SZL, THB, TJS, TMT, TND, TOP, TRY, TTD, TWD, TZS, UAH, UGX, USD, UYU, UZS, VES, VND, VUV, WST, XAF, XCD, XOF, XPF, YER, ZAR, ZMW, ZWL] }
        paymentMode: { type: string, enum: [full, deposit, reserve] }
        checkoutAskForDetails: { type: boolean }
        checkoutAllowReferenceImages: { type: boolean }
        deliveryDefault: { type: string, enum: [pickup, delivery, both] }
        deliveryFee: { type: number, minimum: 0 }
        customDomain: { type: string }
        seoTitle: { type: string }
        seoDescription: { type: string }
        trackingId: { type: string }
        organizationName: { type: string }
        organizationEmail: { type: string }
        organizationPhone: { type: string }
