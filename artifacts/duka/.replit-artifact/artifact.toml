kind = "web"
previewPath = "/"
title = "Take Order"
description = "A multi-channel business operating app for small sellers to manage catalog, orders, inventory, channel attribution, and buyer-facing order links without reading personal chats."
version = "1.0.0"
id = "artifacts/duka"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23398

[services.development]
run = "pnpm --filter @workspace/take-order run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/take-order", "run", "build" ]
serve = "static"
publicDir = "artifacts/duka/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23398"
BASE_PATH = "/"
